name: Bump
options:
  bundleIdPrefix: com.bump
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    SUPPORTS_MACCATALYST: NO
packages:
  SignalRClient:
    url: https://github.com/moozzyk/SignalR-Client-Swift
    from: 0.9.4
targets:
  BumpUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bump.client.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bump
  Bump:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SignalRClient
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # Opts the app out of the iOS 26 Liquid Glass appearance. Bump's design language
        # is flat and opaque; without this the SDK gives TabView, navigation bars and bar
        # buttons translucent refractive chrome that no appearance proxy can override.
        UIDesignRequiresCompatibility: true
        UIRequiresFullScreen: true
        CFBundleLocalizations:
          - en
          - vi
        CFBundleDevelopmentRegion: en
        NSCameraUsageDescription: Bump uses your camera so you can take a photo to share in a post or comment.
        NSLocationWhenInUseUsageDescription: Bump uses your location to tag the shop you're posting about and to find top-rated shops near you.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      configs:
        # Xcode builds get sandbox tokens and TestFlight builds get production ones; the
        # two APNs hosts do not accept each other's. The isSandbox flag the app sends at
        # registration comes from the same #if DEBUG, so the two cannot disagree.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Entitlements/Bump.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Entitlements/Bump.Release.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bump.client
        PRODUCT_NAME: Bump
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_ASSET_PATHS: ""
        # Keeps Localizable.xcstrings in sync: new String(localized:)/LocalizedStringKey
        # literals are extracted into the catalog on build instead of silently shipping
        # untranslated.
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Bump:
    build:
      targets:
        Bump: all
        BumpUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BumpUITests
    archive:
      config: Release
