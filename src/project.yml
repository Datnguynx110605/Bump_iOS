name: Bump
options:
  bundleIdPrefix: com.bump
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    SUPPORTS_MACCATALYST: NO
packages:
  SignalRClient:
    url: https://github.com/moozzyk/SignalR-Client-Swift
    from: 0.9.4
targets:
  Bump:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SignalRClient
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Bump uses your camera so you can take a photo to share in a post or comment.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Bump connects to your local dev server while testing on a physical device.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
              NSTemporaryExceptionAllowsInsecureHTTPSLoads: false
            192.168.1.4:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
              NSTemporaryExceptionAllowsInsecureHTTPSLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bump.client
        PRODUCT_NAME: Bump
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_ASSET_PATHS: ""
schemes:
  Bump:
    build:
      targets:
        Bump: all
    run:
      config: Debug
    archive:
      config: Release
